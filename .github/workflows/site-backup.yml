name: MR Techworks Site Snapshot

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 8 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out all Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create verified website and Git-history snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup
          DATE=$(date -u +%Y-%m-%d)
          git bundle create "backup/MRTechworks-history-${DATE}.bundle" --all
          tar --exclude='./.git' --exclude='./backup' -czf "backup/MRTechworks-site-${DATE}.tar.gz" .
          (cd backup && sha256sum *.bundle *.tar.gz > SHA256SUMS.txt)
          ls -lh backup
          git bundle verify "backup/MRTechworks-history-${DATE}.bundle"
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: mrtechworks-site-backup-${{ github.run_id }}
          path: backup/
          if-no-files-found: error
          retention-days: 90
